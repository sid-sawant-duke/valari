name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Workflows are up to date with src/
        run: npm run check
